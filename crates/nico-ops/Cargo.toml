[package]
name = "nico-ops"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
mcp = ["dep:rmcp", "dep:serde_json", "dep:serde", "dep:uuid"]
bridge = ["mcp", "dep:sha2", "dep:tokio", "dep:tracing", "rmcp/transport-io", "tokio/net", "tokio/sync", "tokio/io-util", "tokio/macros"]

[dependencies]
uuid = { version = "1", features = ["v4"], optional = true }
sha2 = { version = "0.10", optional = true }
tracing = { workspace = true, optional = true }
rmcp = { version = "3.2", default-features = false, features = ["server"], optional = true }
serde_json = { version = "1", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
tokio = { version = "1", features = ["rt", "time"], optional = true }

[lints]
workspace = true

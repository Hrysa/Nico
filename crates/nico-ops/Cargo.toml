[package]
name = "nico-ops"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
mcp = ["dep:rmcp", "dep:serde_json", "dep:tokio"]

[dependencies]
rmcp = { version = "3.2", default-features = false, features = ["server", "transport-io"], optional = true }
serde_json = { version = "1", optional = true }
tokio = { version = "1", features = ["rt", "time"], optional = true }

[lints]
workspace = true

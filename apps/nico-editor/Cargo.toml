[package]
name = "nico-editor"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
nico-authoring = { path = "../../crates/nico-authoring" }
arena-arpg-presentation = { path = "../../games/arena-arpg/presentation", features = ["authoring"] }
nico-scene = { path = "../../crates/nico-scene" }
clap.workspace = true
egui = "0.36.2"
egui_dock = "0.21.1"
glam = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
nico-assets = { path = "../../crates/nico-assets", features = ["watch"] }
nico-presentation = { path = "../../crates/nico-presentation" }
nico-presentation-control = { path = "../../crates/nico-presentation-control", features = ["scene"] }
nico-runtime = { path = "../../crates/nico-runtime" }
nico-ops = { path = "../../crates/nico-ops", features = ["mcp"] }
nico-launch = { path = "../../crates/nico-launch", features = ["editor"] }
nico-winit = { path = "../../crates/nico-winit", features = ["editor"] }

[lints]
workspace = true

[dev-dependencies]
tempfile = "3"

[package]
name = "arena-arpg-client"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
nico-net = { path = "../../../crates/nico-net" }
nico-physics = { path = "../../../crates/nico-physics", default-features = false }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
arena-arpg-shared = { path = "../shared", features = ["tools", "network"] }
clap.workspace = true
nico-assets = { path = "../../../crates/nico-assets", features = ["gltf-import", "png-import", "character"] }
nico-animation = { path = "../../../crates/nico-animation" }
glam = "0.30"
nico-presentation-control = { path = "../../../crates/nico-presentation-control" }
nico-input = { path = "../../../crates/nico-input" }
nico-launch = { path = "../../../crates/nico-launch", features = ["client"] }
nico-ops = { path = "../../../crates/nico-ops", features = ["mcp"] }
nico-presentation = { path = "../../../crates/nico-presentation" }
nico-runtime = { path = "../../../crates/nico-runtime" }
nico-winit = { path = "../../../crates/nico-winit" }
serde_json = "1"
tracing.workspace = true

[lints]
workspace = true
